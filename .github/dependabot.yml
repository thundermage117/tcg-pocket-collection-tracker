# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # pnpm workspace: the root manifest + pnpm-workspace.yaml cover frontend/ too, against the single root lockfile
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "personal"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "personal"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
