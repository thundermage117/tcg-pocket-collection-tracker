name: Supabase keepalive

# Free Supabase projects pause after ~7 days without activity. One cheap request a week
# keeps ours awake. Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.repository != 'marcelpanse/tcg-pocket-collection-tracker'
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/public_decks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
