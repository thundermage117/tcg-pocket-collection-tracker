name: Verify scanner hashes
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/public/images/**'
      - 'frontend/public/hashes/**'
      - 'frontend/assets/cards.json'
  pull_request:
    paths:
      - 'frontend/public/images/**'
      - 'frontend/public/hashes/**'
      - 'frontend/assets/cards.json'
jobs:
  verify-hashes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Verify hashes
        run: |
          pnpm install
          pnpm run hashes --verify
